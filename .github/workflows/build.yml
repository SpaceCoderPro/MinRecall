name: Build MinRecall

on:
  push:
    branches: [ main, develop, fix/gha-windows-build-optimizer-winui-python-paths ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Display Windows SDK versions
      run: |
        Get-ChildItem "HKLM:\SOFTWARE\Microsoft\Windows Kits\Installed Roots" | ForEach-Object { Get-ItemProperty $_.PSPath } | Out-String

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore

    - name: Clean UI project
      run: dotnet clean src/MinRecall.UI/MinRecall.UI.csproj

    - name: Restore dependencies (again for UI)
      run: dotnet restore src/MinRecall.UI/MinRecall.UI.csproj

    - name: Build Core
      run: dotnet build src/MinRecall.Core/MinRecall.Core.csproj --configuration Release --no-restore

    - name: Build CaptureService
      run: dotnet build src/MinRecall.CaptureService/MinRecall.CaptureService.csproj --configuration Release --no-restore

    - name: Build Optimizer
      run: dotnet build src/MinRecall.Optimizer/MinRecall.Optimizer.csproj --configuration Release --no-restore

    - name: Build UI (skipped in CI - requires local Windows build)
      run: |
        Write-Host "::notice title=WinUI 3 Build Limitation::WinUI 3 UI requires local Windows build environment. XamlCompiler.exe has known limitations in GitHub Actions CI/CD due to Windows SDK dependencies. Build Core, CaptureService, and Optimizer successfully. Use local Windows machine to build UI: dotnet build src/MinRecall.UI/MinRecall.UI.csproj"
        exit 0

    - name: Test
      run: dotnet test --no-build --verbosity normal

    - name: Publish CaptureService
      run: dotnet publish src/MinRecall.CaptureService/MinRecall.CaptureService.csproj -c Release -r win-x64 --self-contained -o artifacts/CaptureService

    - name: Publish Optimizer
      run: dotnet publish src/MinRecall.Optimizer/MinRecall.Optimizer.csproj -c Release -r win-x64 --self-contained -o artifacts/Optimizer

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: MinRecall-Windows-x64
        path: artifacts/
        retention-days: 30

  build-core-projects:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build Core
      run: dotnet build src/MinRecall.Core/MinRecall.Core.csproj --configuration Release --no-restore

    - name: Build CaptureService  
      run: dotnet build src/MinRecall.CaptureService/MinRecall.CaptureService.csproj --configuration Release --no-restore

    - name: Build Optimizer
      run: dotnet build src/MinRecall.Optimizer/MinRecall.Optimizer.csproj --configuration Release --no-restore
