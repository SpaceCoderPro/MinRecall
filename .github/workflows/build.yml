name: Build MinRecall

on:
  push:
    branches: [ main, develop, fix/gha-windows-build-optimizer-winui-python-paths ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore

    - name: Build Core
      run: dotnet build src/MinRecall.Core/MinRecall.Core.csproj --configuration Release --no-restore

    - name: Build CaptureService  
      run: dotnet build src/MinRecall.CaptureService/MinRecall.CaptureService.csproj --configuration Release --no-restore

    - name: Build Optimizer
      run: dotnet build src/MinRecall.Optimizer/MinRecall.Optimizer.csproj --configuration Release --no-restore

    - name: Build UI
      run: dotnet build src/MinRecall.UI/MinRecall.UI.csproj --configuration Release --no-restore

    - name: Test
      run: dotnet test --no-build --verbosity normal

    - name: Publish CaptureService
      run: dotnet publish src/MinRecall.CaptureService/MinRecall.CaptureService.csproj -c Release -r win-x64 --self-contained -o artifacts/CaptureService

    - name: Publish Optimizer
      run: dotnet publish src/MinRecall.Optimizer/MinRecall.Optimizer.csproj -c Release -r win-x64 --self-contained -o artifacts/Optimizer

    - name: Publish UI
      run: dotnet publish src/MinRecall.UI/MinRecall.UI.csproj -c Release -r win-x64 --self-contained /p:GenerateAppxPackageOnBuild=true /p:AppxPackageSigningEnabled=false -o artifacts/UI

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: MinRecall-Windows-x64
        path: artifacts/
        retention-days: 30

    - name: Create Release Asset
      if: github.event_name == 'release'
      run: |
        Compress-Archive -Path artifacts/UI/*.msix -DestinationPath MinRecall-UI-${{ github.event.release.tag_name }}.zip

    - name: Upload Release Asset
      uses: actions/upload-release-asset@v1
      if: github.event_name == 'release'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ./MinRecall-UI-${{ github.event.release.tag_name }}.zip
        asset_name: MinRecall-UI-${{ github.event.release.tag_name }}.zip
        asset_content_type: application/zip

  build-core-projects:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build Core
      run: dotnet build src/MinRecall.Core/MinRecall.Core.csproj --configuration Release --no-restore

    - name: Build CaptureService  
      run: dotnet build src/MinRecall.CaptureService/MinRecall.CaptureService.csproj --configuration Release --no-restore

    - name: Build Optimizer
      run: dotnet build src/MinRecall.Optimizer/MinRecall.Optimizer.csproj --configuration Release --no-restore
